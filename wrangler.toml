name = "my-todo"
main = "./.output/server/index.mjs"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npx nuxt build --preset=cloudflare_module"

[assets]
directory = "./.output/public"
binding = "ASSETS"

[[d1_databases]]
binding = "MY_TODO_DB"
database_name = "my-todo-db"
database_id = "d6dcc3d4-ac27-415b-9e32-8875010ab481"

[vars]
NUXT_ALLOWED_EMAIL = "task@ricezero.fun"
NUXT_ACCESS_AUDIENCE = "34af06d8960d7c13f1ff0f088eb8a14c2372c43ca5271c985172d584fa29e799"
NUXT_ACCESS_TEAM_DOMAIN = "ricezero.cloudflareaccess.com"

# ...
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
# ...
